name: Deploy Production

run-name: Deploy ${{ github.sha }} to production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttrpg-production
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false

      - name: Install runner tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends just ripgrep

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install \
            --disable-pip-version-check \
            -r backend/requirements.txt

      - name: Verify and package application
        run: just pack-frontend pack-backend

      - name: Verify generated protocol is committed
        run: git diff --exit-code -- frontend/src/generated/backendProtocol.ts

      - name: Create package checksums
        run: |
          sha256sum \
            ttrpg-frontend.tar.gz \
            ttrpg-backend.tar.gz \
            > ttrpg-deployment.sha256

      - name: Store deployment packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-packages-${{ github.sha }}
          path: |
            ttrpg-frontend.tar.gz
            ttrpg-backend.tar.gz
            ttrpg-deployment.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://bossadapt.org/ttrpg/

    steps:
      - name: Check out selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends just ripgrep

      - name: Download deployment packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-packages-${{ github.sha }}
          path: .

      - name: Verify package checksums
        run: sha256sum --check ttrpg-deployment.sha256

      - name: Configure production SSH
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for required_name in \
            SSH_HOST \
            SSH_PORT \
            SSH_USER \
            SSH_PRIVATE_KEY \
            SSH_KNOWN_HOSTS
          do
            if [[ -z "${!required_name:-}" ]]; then
              printf 'Missing required production secret: %s\n' "$required_name" >&2
              exit 1
            fi
          done

          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            printf 'Production SSH port must be numeric.\n' >&2
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ttrpg_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ttrpg_deploy" "$HOME/.ssh/known_hosts"

          {
            printf 'Host personal\n'
            printf '  HostName %s\n' "$SSH_HOST"
            printf '  Port %s\n' "$SSH_PORT"
            printf '  User %s\n' "$SSH_USER"
            printf '  IdentityFile %s/.ssh/ttrpg_deploy\n' "$HOME"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

          ssh personal true

      - name: Deploy verified packages
        run: just deploy-prebuilt

      - name: Remove deployment credentials
        if: always()
        run: |
          rm -f \
            "$HOME/.ssh/ttrpg_deploy" \
            "$HOME/.ssh/known_hosts" \
            "$HOME/.ssh/config"
